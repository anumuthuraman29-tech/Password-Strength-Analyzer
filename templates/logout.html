<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logged Out — SecurePass Security Suite</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="glass-card" style="max-width: 480px; width: 100%; padding: 3rem 2.5rem; text-align: center;">
      <!-- Glowing Success Shield -->
      <div style="width: 72px; height: 72px; margin: 0 auto 1.5rem auto; border-radius: 50%; background: rgba(16, 185, 129, 0.12); border: 2px solid rgba(16, 185, 129, 0.35); display: flex; align-items: center; justify-content: center; color: #10b981; font-size: 2rem; box-shadow: 0 0 25px rgba(16, 185, 129, 0.25);">
        <i class="fa-solid fa-shield-check"></i>
      </div>

      <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Successfully Logged Out</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.5;">
        Your session has been securely closed. Sensitive memory buffers and local session authentication tokens have been sanitized.
      </p>

      <div style="display: flex; flex-direction: column; gap: 0.85rem;">
        <a href="{{ url_for('login') }}" class="btn btn-primary" style="padding: 0.85rem;">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Login Again</span>
        </a>
        <a href="{{ url_for('landing') }}" class="btn btn-secondary" style="padding: 0.85rem;">
          <i class="fa-solid fa-house"></i>
          <span>Return to Home</span>
        </a>
      </div>

      <div style="margin-top: 2rem; font-size: 0.78rem; color: var(--text-dim); display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
        <span class="status-dot"></span>
        <span>SecurePass Zero-Trust Architecture</span>
      </div>
    </div>
  </div>
</body>
</html>
